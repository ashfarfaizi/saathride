<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="SaathRide — find people travelling your way. Share journeys with photos, say you're interested, and chat before you travel together." />
  <meta name="theme-color" content="#0e7c66" />
  <title>SaathRide — who's travelling your way?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%B5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/">Saath<span>Ride</span></a>
    <div id="authbox" class="authbox"></div>
    <nav id="nav" aria-label="Main"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    SaathRide connects people travelling the same way — we don't operate rides, and profiles and trips are <strong>not verified</strong>.
    Meet in public places, share your plans with someone you trust, and call <strong>112</strong> in an emergency.
  </footer>

  <dialog id="dlg" aria-label="Dialog"></dialog>
  <button id="aiFab" class="ai-fab" type="button" data-act="openAi" data-q="" hidden aria-label="Ask Saath AI"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Saath AI</span></button>
  <aside id="aiPanel" class="ai-panel" hidden aria-hidden="true" aria-label="Saath AI assistant"></aside>
  <div id="callLayer" class="call-layer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
  <script src="/discover.js"></script>
  <script src="/safety.js"></script>
</body>
</html>
